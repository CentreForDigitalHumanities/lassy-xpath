name: tests
on:
  workflow_dispatch:
  push:
    branches:
      - 'develop'
      - 'main'
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: |
        npm ci
    - name: Run tests
      run: |
        npm run build
        npm run test:once
